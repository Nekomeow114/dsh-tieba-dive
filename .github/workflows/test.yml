name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 解析器（离线 fixture）
        run: node test/smoke.mjs
      - name: 纯函数闸门
        run: node test/gates.mjs
